<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Релиз | GOIDA RECORDS</title>
    <link rel="icon" type="image/png" href="media\favicon.png">
    <style>
        :root {
            --bg: #0a0a0a;
            --card-bg: #141414;
            --accent: #ff3b3b;
            --accent-glow: rgba(255, 59, 59, 0.4);
            --text: #e0e0e0;
            --text-muted: #888;
            --border: #222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(255, 59, 59, 0.1) 0%, transparent 60%);
            pointer-events: none;
            z-index: -1;
        }

        /* Навигация */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 5px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text);
            text-decoration: none;
            text-transform: uppercase;
            display: flex;
            align-items: center;
        }
        .logo img {
            height: 80px; /* Здесь задайте нужную высоту логотипа (например, 35-45px) */
            width: auto;  /* Ширина подстроится автоматически */
            display: block;
            filter: brightness(0) invert(1); 
        }
        .logo span {
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--accent);
        }

        /* Основной контент */
        .release-page {
            padding: 140px 5% 80px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .release-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            margin-bottom: 80px;
        }

        .cover-wrapper {
            position: relative;
        }

        .cover-wrapper img {
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 60px rgba(255, 59, 59, 0.1);
            display: block;
            aspect-ratio: 1;
            object-fit: cover;
            background: #1a1a1a;
        }

        .release-meta h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .release-meta .artist {
            font-size: 1.3rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .release-meta .type {
            display: inline-block;
            padding: 6px 16px;
            background: var(--accent);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 20px;
            margin-bottom: 30px;
        }

        .release-meta .description {
            color: var(--text-muted);
            margin-bottom: 40px;
            font-size: 1.05rem;
        }

        /* Площадки */
        .platforms-title {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .platforms {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .platform-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .platform-btn:hover {
            border-color: var(--accent);
            background: rgba(255, 59, 59, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 59, 59, 0.2);
        }

        .platform-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Текст песни */
        .lyrics-section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 50px;
        }

        .lyrics-section h2 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
        }

        .lyrics-section h2::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 40px;
            height: 3px;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .lyrics {
            white-space: pre-line;
            font-size: 1.05rem;
            line-height: 2;
            color: var(--text-muted);
        }

        /* Подвал */
        footer {
            padding: 40px 5%;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        footer p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .socials a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .socials a:hover {
            color: var(--accent);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        @media (max-width: 768px) {
            .release-header {
                grid-template-columns: 1fr;
                gap: 40px;
                text-align: center;
            }
            .platforms {
                justify-content: center;
            }
            .lyrics-section {
                padding: 30px;
            }
            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>

    <nav>
            <a href="index.html" class="logo">
                <img src="media\logo.svg" alt="GOIDA RECORDS">
            </a> 
        <a href="index.html" class="back-link">← Назад</a>
    </nav>

    <div class="release-page">
        <div class="release-header">
            <div class="cover-wrapper">
                <img src="" alt="Обложка релиза" id="release-cover">
            </div>
            <div class="release-meta">
                <span class="type" id="release-type">Сингл</span>
                <h1 id="release-title"></h1>
                <p class="artist" id="release-artist"></p>
                <p class="description" id="release-description"></p>

                <p class="platforms-title">Слушать на площадках</p>
                <div class="platforms" id="release-platforms"></div>
            </div>
        </div>

        <!-- Текст песни -->
        <div class="lyrics-section">
            <h2>Текст песни</h2>
            <div class="lyrics" id="release-lyrics"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 GOIDA RECORDS. Все права защищены.</p>
        <div class="socials">
            <a href="#">Telegram</a>
            <a href="#">VK</a>
            <a href="#">YouTube</a>
        </div>
    </footer>

<script>
    // Иконки площадок (SVG)
    const ICONS = {
        spotify: '<svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>',
        yandex: '<svg viewBox="0 0 24 24"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm2.16 18.24h-2.4v-4.56c-1.2.48-2.4.84-3.6.96v-2.28c1.2-.24 2.4-.6 3.6-1.08V6h2.4v12.24z"/></svg>',
        vk: '<svg viewBox="0 0 24 24"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm5.28 15.6c-.48.6-1.08 1.2-1.68 1.68-.6.48-1.2.72-1.8.72-.72 0-1.32-.24-1.8-.6-.48-.36-.84-.84-1.08-1.44-.24-.6-.36-1.32-.36-2.04 0-1.2.24-2.28.72-3.24.48-.96 1.08-1.68 1.8-2.16.72-.48 1.44-.72 2.16-.72.6 0 1.08.12 1.44.36.36.24.6.6.72 1.08.12.48.12 1.08 0 1.68-.12.6-.36 1.2-.72 1.68-.36.48-.84.84-1.32 1.08-.48.24-1.08.36-1.68.36h-.6v1.2c0 .6.12 1.08.36 1.44.24.36.6.6 1.08.6.48 0 .96-.24 1.44-.72.48-.48.84-1.08 1.08-1.68h1.8c-.24.84-.72 1.56-1.32 2.28z"/></svg>',
        apple: '<svg viewBox="0 0 24 24"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm5.52 16.8c0 .6-.48 1.08-1.08 1.08h-9.6c-.6 0-1.08-.48-1.08-1.08V9.6c0-.6.48-1.08 1.08-1.08h9.6c.6 0 1.08.48 1.08 1.08v7.2zM9.6 8.4h4.8v1.2H9.6V8.4zm0 2.4h4.8v1.2H9.6v-1.2zm0 2.4h4.8V14.4H9.6v-1.2z"/></svg>',
        youtube: '<svg viewBox="0 0 24 24"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.2c-3.96 0-7.2-3.24-7.2-7.2s3.24-7.2 7.2-7.2 7.2 3.24 7.2 7.2-3.24 7.2-7.2 7.2zm-1.2-10.8l4.8 3.6-4.8 3.6v-7.2z"/></svg>'
    };

    const PLATFORM_LABELS = {
        spotify: 'Spotify',
        yandex: 'Yandex Music',
        vk: 'VK Music',
        apple: 'Apple Music',
        youtube: 'YouTube Music'
    };

    // Получаем ID релиза из ссылки (?id=...)
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    fetch('releases.json')
        .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        })
        .then(data => {
            // Поддерживаем массив, объект с полем releases и одиночный объект
            let releases;
            if (Array.isArray(data)) releases = data;
            else if (data.releases && Array.isArray(data.releases)) releases = data.releases;
            else releases = [data];

            // Ищем релиз по ID (с запасным вариантом поиска по названию)
            const release = releases.find(r => r.id === id || r.title === id);

            if (!release) {
                document.querySelector('.release-page').innerHTML =
                    '<p style="color:#ff3b3b;text-align:center;padding:100px 20px;">Релиз не найден</p>';
                return;
            }

            // Заголовок страницы
            document.title = `${release.title} — ${release.artist} | GOIDA RECORDS`;

            // Обложка (убираем ведущий слэш, чтобы путь был относительным)
            const cover = (release.cover || '').replace(/^\//, '');
            const coverImg = document.getElementById('release-cover');
            coverImg.src = cover;
            coverImg.alt = release.title;

            // Метаданные
            document.getElementById('release-title').textContent = release.title;
            document.getElementById('release-artist').textContent = release.artist || '';
            document.getElementById('release-description').textContent = release.description || '';
            document.getElementById('release-type').textContent = release.date || 'Сингл';

            // Текст песни (с сохранением переносов строк)
            document.getElementById('release-lyrics').textContent = release.lyrics || '';

            // Ссылки на площадки
            const container = document.getElementById('release-platforms');
            container.innerHTML = '';

            if (release.links) {
                Object.keys(PLATFORM_LABELS).forEach(key => {
                    const url = release.links[key];
                    if (!url || url === 'Пока нет' || url.trim() === '') return;

                    const a = document.createElement('a');
                    a.href = url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.className = 'platform-btn';
                    a.innerHTML = (ICONS[key] || '') + ' ' + PLATFORM_LABELS[key];
                    container.appendChild(a);
                });
            }

            if (container.children.length === 0) {
                container.innerHTML = '<p style="color:#888;">Ссылки на площадки скоро появятся</p>';
            }
        })
        .catch(err => {
            console.error('Ошибка загрузки релиза:', err);
            document.querySelector('.release-page').innerHTML =
                '<p style="color:#ff3b3b;text-align:center;padding:100px 20px;">Не удалось загрузить релиз</p>';
        });
</script>

</body>
</html>
